# VPS-ONLY deployment template. NOT used by Blitz Cloud (Blitz Cloud provides
# HTTPS and public routing itself). See README "Blitz Cloud Deployment" for
# the primary target.
# ============================================================================
# Nginx reverse proxy template for the Customer AI API on the VPS.
#
#   https://api.example.com  -> Nginx (TLS) -> http://127.0.0.1:5000
#
# Replace api.example.com and the certificate paths before use.
# The Hermes side talks to Customer AI over http://127.0.0.1:5000 directly
# (same host), so the webhook endpoints never need to be public.
# ============================================================================

# HTTP -> HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Media attachments / webhook payloads
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Long webhook/AI requests (the gate runs AI classification)
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Nothing else is served here
    location / {
        return 404;
    }
}