# Customer AI — Nginx reverse proxy for the Google Compute Engine VM.
# Install to /etc/nginx/sites-available/customer-ai and symlink into
# /etc/nginx/sites-enabled/. Replace customer-ai.example.com with the real
# domain before enabling TLS.
#
# The Node backend serves both the API and client/dist, so one upstream handles
# the whole site. Keep 9119 bound to the VM only (do not add a GCP firewall rule
# for it). Run certbot --nginx after DNS points at the VM to add HTTPS; Paystack
# webhooks require a public HTTPS URL.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name customer-ai.example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # AI gate, payment verification and dashboard streams can be slow.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }
}
